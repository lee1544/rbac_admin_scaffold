# ============================================================
# Test-only configuration.
# This file shadows src/main/resources/application.properties on the
# test classpath, so tests never connect to MySQL and never run Flyway.
# Production/dev schema management is covered by db/migration.
# ============================================================
spring.application.name=rbac-admin-scaffold

spring.datasource.url=jdbc:h2:mem:rbac;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=test-secret-that-is-long-enough-for-hs512-signing-0123456789abcdef
jwt.expiration=604800
dev.bypass-token=
cors.allowed-origins=*
