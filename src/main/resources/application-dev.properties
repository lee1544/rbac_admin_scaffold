# ============================================================
# Development profile: MySQL.
# Create the database first:
#   CREATE DATABASE rbac_admin DEFAULT CHARACTER SET utf8mb4;
# Then run: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rbac_admin?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For a scaffold, auto-create/update tables is convenient.
# In production, set JPA_DDL_AUTO=validate and manage schema with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
