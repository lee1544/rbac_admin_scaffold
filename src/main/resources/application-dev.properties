# ============================================================
# Development profile: MySQL (default profile).
#
# Create the database first:
#   CREATE DATABASE rbac_admin_scaffold DEFAULT CHARACTER SET utf8mb4;
#
# Then run:
#   mvn spring-boot:run
#   or explicitly: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Tables are created/upgraded automatically by Flyway on startup.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rbac_admin_scaffold?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
