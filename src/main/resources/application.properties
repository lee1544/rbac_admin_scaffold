spring.application.name=rbac-admin-scaffold

# Server
server.port=${SERVER_PORT:8080}

# Default profile is "local": H2 in-memory database, zero configuration.
# Switch to "dev" (MySQL) with: --spring.profiles.active=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT. CHANGE THIS IN ANY REAL ENVIRONMENT.
jwt.secret=${JWT_SECRET:rbac-admin-scaffold-default-secret-change-me-please-0123456789abcdef}
# Seconds. Default: 7 days.
jwt.expiration=${JWT_EXPIRATION:604800}

# Development bypass token. Empty means disabled. NEVER enable it in production.
dev.bypass-token=${DEV_BYPASS_TOKEN:}

# CORS. Comma separated origin patterns. "*" is convenient for local development.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.example.rbac=INFO
