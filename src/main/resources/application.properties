spring.application.name=rbac-admin-scaffold

# Server
server.port=${SERVER_PORT:8080}

# Default profile is "dev": MySQL + Flyway.
# Override with: --spring.profiles.active=dev|prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA: schema is managed by Flyway, never by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway: executes src/main/resources/db/migration/V*.sql at startup.
# baseline-on-migrate allows adopting an existing schema; clean is disabled for safety.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# JWT. CHANGE THIS IN ANY REAL ENVIRONMENT.
jwt.secret=${JWT_SECRET:rbac-admin-scaffold-default-secret-change-me-please-0123456789abcdef}
# Seconds. Default: 7 days.
jwt.expiration=${JWT_EXPIRATION:604800}

# Development bypass token. Empty means disabled. NEVER enable it in production.
dev.bypass-token=${DEV_BYPASS_TOKEN:}

# CORS. Comma separated origin patterns. "*" is convenient for local development.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.example.rbac=INFO
